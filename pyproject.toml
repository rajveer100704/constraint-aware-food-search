[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swiggy-hybrid-search-engine"
version = "3.0.0"
description = "SLM-powered Food-Delivery Hybrid Search & Recommendation Engine (Qwen3.5-0.8B LoRA Query Parsing + BM25 + Multi-Feature Ranking)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Rajveer", email = "rajveer@example.com"}
]
keywords = ["search-engine", "hybrid-retrieval", "slm", "qwen", "lora", "bm25", "swiggy", "recommender-systems", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rank_bm25>=0.2.2",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v"
testpaths = ["tests"]
